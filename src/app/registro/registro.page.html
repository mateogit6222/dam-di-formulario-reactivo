<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Registro de Usuario</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="toggleDarkMode()">
        {{ darkMode() ? '☀️ Claro' : '🌙 Oscuro' }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Contenedor adaptativo RWD para móviles, tablets y escritorios -->
  <ion-grid fixed>
    <ion-row class="ion-justify-content-center">
      <ion-col size="12" size-md="8" size-lg="6">
        <ion-card class="ion-no-margin">
          <ion-card-header>
            <ion-card-title class="ion-text-center">Crear Cuenta</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
              <ion-list lines="full">
                <!-- Campo Nombre -->
                <ion-item>
                  <ion-input
                    label="Nombre completo"
                    labelPlacement="floating"
                    type="text"
                    formControlName="nombre"
                    errorText="El nombre es obligatorio (mín. 3 caracteres)."
                  >
                  </ion-input>
                </ion-item>

                <!-- Campo Email -->
                <ion-item>
                  <ion-input
                    label="Correo Electrónico"
                    labelPlacement="floating"
                    type="email"
                    inputmode="email"
                    formControlName="email"
                    errorText="Introduzca un email válido."
                  >
                  </ion-input>
                </ion-item>

                <!-- Campo Contraseña -->
                <ion-item>
                  <ion-input
                    label="Contraseña"
                    labelPlacement="floating"
                    type="password"
                    formControlName="password"
                    errorText="Mínimo 8 caracteres, letras y números."
                  >
                  </ion-input>
                </ion-item>

                <!-- Campo Fecha de Nacimiento -->
                <ion-item>
                  <ion-input
                    label="Fecha de Nacimiento"
                    labelPlacement="floating"
                    type="date"
                    formControlName="fechaNacimiento"
                    [max]="maxFechaHoy"
                    errorText="La fecha es obligatoria y no puede ser futura."
                  >
                  </ion-input>
                </ion-item>
              </ion-list>

              <div class="ion-padding-top">
                <ion-button
                  expand="block"
                  type="submit"
                  [disabled]="registroForm.invalid || isSubmitting()"
                >
                  <span *ngIf="!isSubmitting()">Registrarse</span>
                  <ion-spinner name="crescent" *ngIf="isSubmitting()"></ion-spinner>
                </ion-button>
              </div>
            </form>

            <!-- Botón Descargar PDF tras registro -->
            <div *ngIf="datosEnviados()" class="ion-padding-top">
              <ion-button expand="block" color="success" (click)="descargarPDF()">
                📥 Descargar Datos en PDF
              </ion-button>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
