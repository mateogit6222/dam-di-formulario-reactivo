<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Registro de Usuario</ion-title>

    <ion-buttons slot="end">
      <!-- Botón para navegar y comparar con el formulario Template-Driven -->
      <ion-button routerLink="/driven" fill="outline">
        Ver Driven 🔄
      </ion-button>

      <!-- Botón para alternar modo claro / oscuro -->
      <ion-button (click)="toggleDarkMode()">
        {{ darkMode() ? '☀️ Claro' : '🌙 Oscuro' }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Grid adaptativo para Responsive Web Design (RWD) en móviles, tablets y PCs -->
  <ion-grid fixed>
    <ion-row class="ion-justify-content-center">
      <ion-col size="12" size-md="8" size-lg="6">
        <ion-card class="ion-no-margin">
          <ion-card-header>
            <ion-card-title class="ion-text-center">Crear Cuenta (Reactivo)</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
              <ion-list lines="full">
                <!-- 1. Campo Nombre Completo -->
                <ion-item>
                  <ion-input
                    label="Nombre completo"
                    labelPlacement="floating"
                    type="text"
                    formControlName="nombre"
                    errorText="El nombre es obligatorio (mín. 3 caracteres)."
                  >
                  </ion-input>
                </ion-item>

                <!-- 2. Campo Correo Electrónico con teclado optimizado para móviles -->
                <ion-item>
                  <ion-input
                    label="Correo Electrónico"
                    labelPlacement="floating"
                    type="email"
                    inputmode="email"
                    formControlName="email"
                    errorText="Introduzca un correo electrónico válido."
                  >
                  </ion-input>
                </ion-item>

                <!-- 3. Campo Contraseña -->
                <ion-item>
                  <ion-input
                    label="Contraseña"
                    labelPlacement="floating"
                    type="password"
                    formControlName="password"
                    errorText="Mínimo 8 caracteres, al menos una letra y un número."
                  >
                  </ion-input>
                </ion-item>

                <!-- 4. Campo Fecha de Nacimiento (con límite máximo en el día actual) -->
                <ion-item>
                  <ion-input
                    label="Fecha de Nacimiento"
                    labelPlacement="floating"
                    type="date"
                    formControlName="fechaNacimiento"
                    [max]="maxFechaHoy"
                    errorText="La fecha es obligatoria y no puede ser posterior a hoy."
                  >
                  </ion-input>
                </ion-item>
              </ion-list>

              <!-- Botón de Envío con gestión de estado mediante Signal -->
              <div class="ion-padding-top">
                <ion-button
                  expand="block"
                  type="submit"
                  [disabled]="registroForm.invalid || isSubmitting()"
                >
                  <span *ngIf="!isSubmitting()">Registrarse</span>
                  <ion-spinner name="crescent" *ngIf="isSubmitting()"></ion-spinner>
                </ion-button>
              </div>
            </form>

            <!-- Botón de Descarga de PDF (disponible tras enviar el formulario) -->
            <div *ngIf="datosEnviados()" class="ion-padding-top">
              <ion-button expand="block" color="success" (click)="descargarPDF()">
                📥 Descargar Resguardo en PDF
              </ion-button>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
