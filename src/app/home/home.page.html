<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Registro de Usuario</ion-title>
    <!-- Requisito 7: Botón para conmutar modo oscuro -->
    <ion-buttons slot="end">
      <ion-button (click)="toggleDarkMode()">
        {{ darkMode() ? '☀️ Claro' : '🌙 Oscuro' }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <ion-list lines="full">
      <!-- Campo Nombre -->
      <ion-item>
        <ion-input
          label="Nombre completo"
          labelPlacement="floating"
          type="text"
          formControlName="nombre"
          errorText="El nombre es obligatorio (mín. 3 caracteres)."
        >
        </ion-input>
      </ion-item>

      <!-- Campo Email -->
      <ion-item>
        <ion-input
          label="Correo Electrónico"
          labelPlacement="floating"
          type="email"
          inputmode="email"
          formControlName="email"
          errorText="Introduzca un email válido."
        >
        </ion-input>
      </ion-item>

      <!-- Campo Contraseña -->
      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          type="password"
          formControlName="password"
          errorText="Mínimo 8 caracteres, letras y números."
        >
        </ion-input>
      </ion-item>

      <!-- Requisitos 4 y 6: Campo Fecha de Nacimiento -->
      <ion-item>
        <ion-input
          label="Fecha de Nacimiento"
          labelPlacement="floating"
          type="date"
          formControlName="fechaNacimiento"
          [max]="maxFechaHoy"
          errorText="La fecha es obligatoria y no puede ser posterior a hoy."
        >
        </ion-input>
      </ion-item>
    </ion-list>

    <!-- Botón de Enviar Formulario -->
    <div class="ion-padding-top">
      <ion-button
        expand="block"
        type="submit"
        [disabled]="registroForm.invalid || isSubmitting()"
      >
        <span *ngIf="!isSubmitting()">Registrarse</span>
        <ion-spinner name="crescent" *ngIf="isSubmitting()"></ion-spinner>
      </ion-button>
    </div>
  </form>

  <!-- Requisito 8: Botón de Descarga de PDF tras registrarse -->
  <div *ngIf="datosEnviados()" class="ion-padding-top">
    <ion-button expand="block" color="success" (click)="descargarPDF()">
      📥 Descargar Datos en PDF
    </ion-button>
  </div>
</ion-content>
